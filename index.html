<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollyBuilder Pro</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="top-nav">
            <div class="logo">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ScrollyBuilder <span class="badge">PRO</span>
            </div>
            <div class="actions">
                <button id="btn-preview" class="btn btn-secondary"><i class="fa-solid fa-play"></i> Preview</button>
                <button id="btn-export" class="btn btn-primary"><i class="fa-solid fa-code"></i> Export Code</button>
            </div>
        </header>

        <div class="workspace">
            <!-- Left Sidebar (Blocks) -->
            <aside class="sidebar sidebar-left">
                <div class="sidebar-header">Add Blocks</div>
                <div class="block-list" id="block-palette">
                    <!-- Blocks will be injected here by JS -->
                </div>
            </aside>

            <!-- Main Canvas -->
            <main class="canvas-container">
                <div class="canvas-header">
                    <span><i class="fa-solid fa-desktop"></i> Desktop View</span>
                </div>
                <div class="canvas" id="canvas">
                    <!-- Builder content goes here -->
                    <div class="empty-state">
                        <i class="fa-solid fa-layer-group"></i>
                        <p>Drag or click a block from the left to start building</p>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar (Properties) -->
            <aside class="sidebar sidebar-right">
                <div class="sidebar-header">Properties</div>
                <div class="properties-panel" id="properties-panel">
                    <div class="empty-state-small">Select a block to edit its properties and animations</div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Exported Code</h2>
                <button id="btn-close-modal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p>Copy this code and paste it into an <code>index.html</code> file in your GitHub repository.</p>
                <textarea id="export-code" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button id="btn-copy-code" class="btn btn-primary"><i class="fa-solid fa-copy"></i> Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
